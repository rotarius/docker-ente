services:
  postgres:
    image: postgres:15
    container_name: ente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ente_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ${POSTGRES_DB:-ente_db} -U ${POSTGRES_USER:-pguser}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Object storage (S3) is provided by the shared MinIO instance in
  # docker-minio, reachable as "minio:9000" on traefik_network / publicly at
  # https://s3.cloud-works.ch - see museum.yaml.example and the README.

  museum:
    image: ghcr.io/ente/server:latest
    container_name: ente-museum
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./museum.yaml:/museum.yaml:ro
    networks:
      - internal
      - traefik_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.ente-api.rule=Host(`ente-api.cloud-works.ch`)"
      - "traefik.http.routers.ente-api.entrypoints=websecure"
      - "traefik.http.routers.ente-api.tls=true"
      - "traefik.http.routers.ente-api.tls.certresolver=myresolver"
      - "traefik.http.routers.ente-api.middlewares=secureHeaders@file"
      - "traefik.http.services.ente-api.loadbalancer.server.port=8080"

  web:
    image: ghcr.io/ente/web:latest
    container_name: ente-web
    restart: unless-stopped
    depends_on:
      museum:
        condition: service_healthy
    environment:
      ENTE_API_ORIGIN: https://ente-api.cloud-works.ch
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      # Photos web app
      - "traefik.http.routers.ente.rule=Host(`ente.cloud-works.ch`)"
      - "traefik.http.routers.ente.entrypoints=websecure"
      - "traefik.http.routers.ente.tls=true"
      - "traefik.http.routers.ente.tls.certresolver=myresolver"
      - "traefik.http.routers.ente.middlewares=secureHeaders@file"
      - "traefik.http.services.ente.loadbalancer.server.port=3000"
      # Public albums app
      - "traefik.http.routers.ente-albums.rule=Host(`ente-albums.cloud-works.ch`)"
      - "traefik.http.routers.ente-albums.entrypoints=websecure"
      - "traefik.http.routers.ente-albums.tls=true"
      - "traefik.http.routers.ente-albums.tls.certresolver=myresolver"
      - "traefik.http.routers.ente-albums.middlewares=secureHeaders@file"
      - "traefik.http.services.ente-albums.loadbalancer.server.port=3002"

networks:
  internal:
  traefik_network:
    external: true

volumes:
  postgres_data:
